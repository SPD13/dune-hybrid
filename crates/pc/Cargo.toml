[package]
name = "pc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A minimal DOS PC for running Dune CD: memory, PIC, PIT, VGA, keyboard, mouse and BIOS/DOS services in Rust"

[features]
default = ["interp"]
# The x86 interpreter. Without it, only recompiled code runs (`--rec`
# native timing): code with no Rust version stops the machine
# (`RunExit::Unlifted`) instead of being interpreted.
interp = []

[dependencies]
cpu = { workspace = true }
gfx = { workspace = true }
oplon = "1"
miniz_oxide = "0.8"
