[package]
name = "lift"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Static recompiler: DNCDPRG.EXE seg000 routines to Rust (generates crates/dune-rec)"

[[bin]]
name = "dune-lift"
path = "src/main.rs"

[dependencies]
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
