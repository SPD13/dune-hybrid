[package]
name = "runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Headless native runner: boots DNCDPRG.EXE and writes screenshots"

[[bin]]
name = "dune-run"
path = "src/main.rs"

[features]
default = ["interp"]
# Build without the interpreter: `cargo build -p runner --no-default-features`.
interp = ["pc/interp"]

[dependencies]
pc = { workspace = true }
gfx = { workspace = true }
dune-rec = { path = "../dune-rec" }
png = "0.18"
