[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
cpu = { path = "crates/cpu" }
pc = { path = "crates/pc", default-features = false }
gfx = { path = "crates/gfx" }

[profile.release]
debug = 1

# The generated code (15 MB of Rust) without debug info: with line tables
# its compile needs much more memory.
[profile.release.package.dune-rec]
debug = 0
